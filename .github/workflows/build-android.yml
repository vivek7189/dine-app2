name: Build Android APK

# Builds a signed release APK and publishes it to the "android-latest" GitHub
# release (the stable download link the DineOpen site points at).
#
# Trigger:
#   - push a tag like v2.92.0  → builds + publishes
#   - or run manually from the Actions tab (workflow_dispatch)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your release keystore (.jks/.keystore)
#                             create with:  base64 -i release.keystore | pbcopy
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_PASSWORD      key password
#   ANDROID_KEY_ALIAS         key alias
#   (GITHUB_TOKEN is provided automatically for the release upload.)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DineOpen-Waiter.apk

      - name: Publish to android-latest release (stable download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-latest >/dev/null 2>&1 \
            && gh release upload android-latest DineOpen-Waiter.apk --clobber \
            || gh release create android-latest DineOpen-Waiter.apk \
                 --title "DineOpen Waiter App (Android APK)" \
                 --notes "Latest DineOpen Waiter/POS Android APK. Direct install — allow 'Install unknown apps'."

      - name: Also publish a versioned release (history)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" DineOpen-Waiter.apk \
            --title "DineOpen Waiter ${{ github.ref_name }}" \
            --notes "Android APK for ${{ github.ref_name }}." || true

      - name: Upload APK as build artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: DineOpen-Waiter-apk
          path: DineOpen-Waiter.apk
          retention-days: 30
