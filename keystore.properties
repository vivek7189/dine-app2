# ============================================
# KEYSTORE CONFIGURATION FOR RELEASE BUILDS
# ============================================
# This file contains sensitive keystore information.
# NEVER commit this file to version control!
# Keep a secure backup of this file and your keystore file.

# Keystore File Path
# Location: dine-app/release.keystore (root of project)
# If your keystore is in a different location, update this path
storeFile=release.keystore

# Keystore Password
# The password you used when creating the keystore
storePassword=abcd

# Key Alias (Optional)
# Default: "key0" (most common default)
# Only uncomment and set if your keystore uses a different alias
# keyAlias=key0

# Key Password (Optional)
# Default: Uses storePassword if not provided
# Only uncomment and set if your key has a different password than the keystore
# keyPassword=YOUR_KEY_PASSWORD_HERE

# ============================================
# IMPORTANT NOTES:
# ============================================
# 1. Replace YOUR_KEYSTORE_PASSWORD_HERE with your actual keystore password
# 2. If you used "key0" as alias (most common), you don't need to set keyAlias
# 3. If key password is same as store password, you don't need to set keyPassword
# 4. Keep this file and release.keystore in a secure location
# 5. For future builds, use the SAME keystore file and passwords
